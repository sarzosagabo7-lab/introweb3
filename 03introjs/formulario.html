<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Sumas</h2>

    <form>
        <table>
            <tr>
                <td>numero 1:</td>
                <td>
                    <input id="txtNum1" type="text" />
                </td>
            </tr>

            <tr>
                <td>numero 2:</td>
                <td>
                    <input id="txtNum2" type="text" />
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <button id="boton_suma">Sumar</button>

                </td>
            </tr>

        </table>

    </form>
</body>

</html>

<script>

    document.getElementById('boton_suma').addEventListener('click', function () {
        var num1 = parseFloat(document.getElementById("txtNum1").value);
        var num2 = parseFloat(document.getElementById("txtNum2").value);

        var result = num1 + num2;


        alert("El resultado es : " + result);
    });

</script>
